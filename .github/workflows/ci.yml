name: macOS build and checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check workflow without Docker
        run: zsh diagnostics/check_build_workflow.sh
      - name: Build Universal app and run self-tests
        run: zsh build_app.sh
        env:
          EDGE_APP_BUILD_ROOT: ${{ runner.temp }}/spartan-release
      - uses: actions/upload-artifact@v7
        with:
          name: spartan-macos-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/spartan-release/*.zip
            ${{ runner.temp }}/spartan-release/SHA256SUMS.txt
          if-no-files-found: error
